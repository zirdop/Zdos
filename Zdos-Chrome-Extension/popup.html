<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zdos</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo">Z</span><div><b>ZDOS</b><small>Console</small></div></div>
    <div class="status"><i></i> WEB-SIDE</div>
  </header>

  <div class="toolbar">
    <button id="reset" class="danger">RESET PAGE</button>

    <button class="tab active" data-tab="Info">Info</button>
    <button class="tab" data-tab="Main">Main</button>
    <button class="tab" data-tab="FullDestroyer">FullDestroyer</button>
    <button class="tab" data-tab="DDOS">DDOS</button>
    <button class="tab" data-tab="Admin">Admin</button>
  </nav>

  <main id="mods"></main>
  <footer><span>Zdos v1.0</span><span>⚡ Network: Active • Script By Zirdop</span></footer>
</div>
<script src="popup.js"></script>
